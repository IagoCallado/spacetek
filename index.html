    /* ---------- Utilidades ---------- */
    function irPara(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }




    /* Config de frete do painel (gravada em produtos/_site) — preenchida pelo App. */
    window.FRETE_CONFIG = null;



    /* Assinatura dos campos que importam no carrinho. Se mudar, o item antigo
       e descartado (evita orcar com dados velhos). Ignora ordem/destaque/id/qtd. */
    function assinaturaProduto(p) {
      if (!p) return "";
      return [
        p.nome, p.categoria, p.secao || "catalogo", p.preco, p.descricao,
        p.filamento, p.peso, p.comprimento, p.largura, p.altura, p.dimensoes,
        p.imagem, !!p.novo, !!p.esgotado
      ].join("|");
    }


    function formatCep(v) {
      const d = (v || "").replace(/\D/g, "").slice(0, 8);
      return d.length > 5 ? d.slice(0, 5) + "-" + d.slice(5) : d;
    }






    function tabelaFreteAtual() {
      const c = window.FRETE_CONFIG;
      if (c && Array.isArray(c.tabelaFrete) && c.tabelaFrete.length === 10) return c.tabelaFrete;
      return window.FRETE_TABELA;
    }


    /* Frete estimado (tabela por regiao) com as regras do painel.
       itens: lista do carrinho (usa peso/qtd). subtotal: para frete gratis.
       Retorna null (CEP incompleto), { aCombinar:true }, { gratis:true } ou { valor, regiao }. */
    function calcularFrete(cep, itens, subtotal) {
      const d = (cep || "").replace(/\D/g, "");
      if (d.length !== 8) return null;
      const digito = parseInt(d[0], 10);
      const regiao = REGIOES_CEP[digito] || "";
      const c = window.FRETE_CONFIG || {};

      if (itens && itens.length && itens.some((i) => !temMedidasFrete(i))) {
        return { aCombinar: true, valor: null, regiao: regiao };
      }

      const limite = Number(c.freteGratis) || 0;
      if (limite > 0 && subtotal != null && subtotal >= limite) {
        return { valor: 0, gratis: true, regiao: regiao };
      }

      let extra = 0;
      if (itens && itens.length) {
        const kg = itens.reduce((s, i) => s + (pesoKgDe(i) || 0) * (i.qtd || 1), 0);
        const incluso = Number(c.pesoIncluidoKg) || 0;
        const porKg = Number(c.valorKgExcedente) || 0;
        if (kg > incluso && porKg > 0) extra = (kg - incluso) * porKg;
      }

      const base = Number(tabelaFreteAtual()[digito]);
      if (!isFinite(base)) return null;
      return { valor: Math.round((base + extra) * 100) / 100, regiao: regiao, estimado: true };
    }

    /* Texto do frete para exibir (usado em sacola/orcamento). */
    function freteTexto(frete) {
      if (!frete) return "informe o CEP";
      if (frete.aCombinar) return "a combinar";
      if (frete.gratis) return "Grátis";
      if (frete.real) {
        const nome = [frete.transportadora, frete.servico].filter(Boolean).join(" ");
        return formatBRL(frete.valor) + (nome ? " • " + nome : "") +
          (frete.prazo != null ? " • " + frete.prazo + " dias" : "");
      }
      return formatBRL(frete.valor) + (frete.regiao ? " • " + frete.regiao : "");
    }

    /* Cotacao real via Cloudflare Worker (endpoint configurado no painel).
       Retorna { opcoes: [...], estimado: bool } ou null (sem endpoint /
       falha / itens sem medidas). "estimado" = o Worker devolveu a tabela
       de reserva porque o provedor de frete esta fora do ar. */
    async function cotarFreteRemoto(cep, itens) {
      const c = window.FRETE_CONFIG || {};
      const base = String(c.endpoint || "").replace(/\/+$/, "");
      const destino = (cep || "").replace(/\D/g, "");
      if (!base || destino.length !== 8) return null;
      const produtos = (itens || []).map((i) => {
        const m = medidasDe(i) || {};
        return {
          id: i.id || i.nome,
          width: Number(m.largura) || 0,
          height: Number(m.altura) || 0,
          length: Number(m.comprimento) || 0,
          weight: pesoKgDe(i) || 0,
          insurance_value: precoDe(i) || 0,
          quantity: i.qtd || 1
        };
      }).filter((p) => p.weight > 0 && p.width > 0 && p.height > 0 && p.length > 0);
      if (!produtos.length) return null;
      try {
        const resp = await fetch(base + "/quote", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cepOrigem: (c.cepOrigem || "").replace(/\D/g, ""), cep: destino, items: produtos })
        });
        if (!resp.ok) return null;
        const data = await resp.json();
        const ops = data && data.opcoes;
        if (!Array.isArray(ops) || !ops.length) return null;
        const opcoes = ops.map((o, idx) => ({
          id: o.id != null ? String(o.id) : String(idx),
          servico: o.servico || o.name || "Frete",
          empresa: o.empresa || o.company || "",
          preco: Number(o.preco != null ? o.preco : o.price) || 0,
          prazo: o.prazo != null ? o.prazo : (o.delivery_time != null ? o.delivery_time : null),
          estimado: !!o.estimado
        }));
        return { opcoes, estimado: !!data.fallback || opcoes.some((o) => o.estimado) };
      } catch (e) { return null; }
    }

    /* Registra um evento de uso no Worker (contadores do painel admin).
       Nunca bloqueia a interface e falha em silencio. */
    function registrarEvento(pagina) {
      try {
        const worker = window.WORKER_URL || "https://spacetek-frete.spacetek.workers.dev";
        const payload = JSON.stringify({ pagina: pagina });
        if (navigator.sendBeacon) {
          /* Conteudo "text/plain" e um tipo seguro em CORS: o beacon vai sem
             preflight (o Worker le o corpo como JSON de qualquer forma). */
          const blob = new Blob([payload], { type: "text/plain;charset=UTF-8" });
          if (navigator.sendBeacon(worker + "/event", blob)) return;
        }
        fetch(worker + "/event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: payload,
          keepalive: true
        }).catch(() => {});
      } catch (e) { /* ignora */ }
    }

    /* ---------- WhatsApp do cliente ----------
       O numero e obrigatorio no checkout: e por ele que o painel admin
       avisa o cliente quando o status do pedido muda. */
    function digitosWhatsapp(v) {
      return String(v || "").replace(/\D/g, "");
    }
    /* (00) 00000-0000 — mostra os 2 primeiros digitos como DDD. */
    function mascaraWhatsapp(v) {
      const d = digitosWhatsapp(v).slice(0, 11);
      if (!d) return "";
      if (d.length <= 2) return "(" + d;
      if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
      if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
      return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
    }
    /* Numero completo para o WhatsApp: 55 + DDD + numero (sem +). */
    function numeroWhatsappCompleto(v) {
      let d = digitosWhatsapp(v);
      if (!d) return "";
      if (d.length === 13 && d.slice(0, 2) === "55") d = d.slice(2);
      if (d.length === 11 && d.slice(0, 2) === "55") d = d.slice(2);
      return "55" + d;
    }
    /* 10 digitos (fixo) ou 11 (celular) — com DDD. */
    function numeroWhatsappValido(v) {
      const d = digitosWhatsapp(v);
      return d.length === 10 || d.length === 11;
    }

    /* ---------- Icones ---------- */

    /* ---------- Header ---------- */
    function Header({ cartCount, onOpenCart, onInicio, onVerTodos, onQuemSomos, onToggleMenu, onLogoAdmin }) {
      const [logoOk, setLogoOk] = React.useState(true);
      const [scrol, setScrol] = React.useState(false);
      const clickTimer = React.useRef(null);

      React.useEffect(() => {
        const onS = () => setScrol(window.scrollY > 6);
        onS();
        window.addEventListener("scroll", onS, { passive: true });
        return () => window.removeEventListener("scroll", onS);
      }, []);

      const logoClick = (e) => {
        e.preventDefault();
        if (clickTimer.current) {
          clearTimeout(clickTimer.current);
          clickTimer.current = null;
          onLogoAdmin();
        } else {
          clickTimer.current = setTimeout(() => { clickTimer.current = null; onInicio(); }, 260);
        }
      };

      return h("header", { className: "header" + (scrol ? " header--scroll" : "") },
        h("div", { className: "header__inner" },
          h("div", { className: "header__left" },
            h("button", { className: "nav__menu", onClick: onToggleMenu, "aria-label": "Abrir menu" }, h(MenuIcon, null)),
            h("a", { className: "brand", href: "#inicio", onClick: logoClick,
              title: "Clique: início • Duplo clique: abrir o painel do administrador" },
              logoOk
                ? h("img", { className: "brand__logo", src: "assets/images/logo.jpg", alt: "SpaceTek",
                    onError: () => setLogoOk(false) })
                : h("span", { className: "brand__fallback" }, "Space", h("span", null, "Tek"))
            )
          ),
          h("nav", { className: "nav", "aria-label": "Navegação principal" },
            h("button", { className: "nav__link", onClick: onInicio }, "Início"),
            h("button", { className: "nav__link", onClick: onVerTodos }, "Ver todos os produtos"),
            h("button", { className: "nav__link", onClick: onQuemSomos }, "Quem somos"),
            h("button", { className: "nav__cart", onClick: onOpenCart, "aria-label": "Sacola de compras" },
              h(CartIcon, null),
              cartCount > 0 && h("span", { className: "nav__badge" }, cartCount)
            )
          )
        )
      );
    }

    /* ---------- Menu lateral ---------- */
    function MenuDrawer({ open, onClose, onInicio, onVerTodos, onQuemSomos, onPersonalizado, categorias, onCategoria }) {
      React.useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape") onClose(); };
        if (open) document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [open, onClose]);

      return h(React.Fragment, null,
        h("div", { className: "overlay" + (open ? " overlay--show" : ""), onClick: onClose }),
        h("aside", { className: "drawer drawer--left" + (open ? " drawer--open" : ""),
          "aria-hidden": !open, "aria-label": "Menu" },
          h("div", { className: "drawer__head" },
            h("h2", null, "Menu"),
            h("button", { className: "drawer__close", onClick: onClose, "aria-label": "Fechar" }, "×")
          ),
          h("div", { className: "drawer__body" },
            h("button", { className: "menu__item", onClick: onInicio }, "Início"),
            h("button", { className: "menu__item", onClick: onVerTodos }, "Ver todos os produtos"),
            h("button", { className: "menu__item", onClick: onQuemSomos }, "Quem somos"),
            h("button", { className: "menu__item", onClick: onPersonalizado }, "Impressão personalizada"),
            h("p", { className: "menu__heading" }, "Pesquisar por categoria"),
            categorias.length === 0
              ? h("p", { className: "drawer__empty" }, "Sem categorias.")
              : h("div", { className: "menu__cats" },
                  categorias.map((c) => h("button", { key: c, className: "menu__cat",
                    onClick: () => onCategoria(c) }, c))
                )
          )
        )
      );
    }

    /* ---------- Card de produto ---------- */
    function ProductCard({ produto, onAdd, qtd, onOpen }) {
      const preco = precoDe(produto);
      const esgotado = !!produto.esgotado;
      return h("article", { className: "card card--click" + (esgotado ? " card--esgotado" : ""),
          onClick: () => onOpen && onOpen(produto) },
        h("div", { className: "card__media" },
          esgotado
            ? h("span", { className: "card__badge card__badge--esgotado" }, "Esgotado")
            : (produto.novo && h("span", { className: "card__badge" }, "Novo")),
          h("img", { src: produto.imagem, alt: produto.nome, loading: "lazy" })
        ),
        h("div", { className: "card__body" },
          h("h3", { className: "card__title" }, produto.nome),
          h("p", { className: "card__cat" }, produto.categoria),
          h("p", { className: "card__price" }, preco ? formatBRL(preco) : "Sob consulta"),
          h("button", { className: "btn btn--primary card__add", disabled: esgotado,
            onClick: (e) => { e.stopPropagation(); if (!esgotado) onAdd(produto); } },
            esgotado ? "Esgotado" : "Adicionar"),
          qtd > 0 && h("span", { className: "card__qtd" }, "No carrinho: " + qtd)
        )
      );
    }

    /* ---------- Detalhe do produto (modal) ---------- */
    function ProdutoModal({ produto, onClose, onAdd }) {
      const [cep, setCep] = React.useState("");
      const [opcoes, setOpcoes] = React.useState(null);
      const [opcaoSel, setOpcaoSel] = React.useState(null);
      const [cotando, setCotando] = React.useState(false);
      const [cotacaoErro, setCotacaoErro] = React.useState(false);
      const cepTimer = React.useRef(null);
      const preco = precoDe(produto);

      /* Frete da tabela (reserva, usada quando o endpoint nao responde).
         Tambem aplica a regra de frete gratis do painel. */
      const itemUnico = React.useMemo(
        () => Object.assign({}, produto, { qtd: 1 }), [produto]);
      const estatico = React.useMemo(
        () => calcularFrete(cep, [itemUnico], preco || 0), [cep, itemUnico, preco]);

      /* Cotacao real no endpoint (Worker). A tabela so entra quando o
         endpoint falha ou o produto nao tem medidas para cotar. */
      const cotar = React.useCallback(async (cepDigits) => {
        if (!cepDigits || cepDigits.length !== 8) return;
        setCotando(true);
        setCotacaoErro(false);
        const res = await cotarFreteRemoto(cepDigits, [itemUnico]);
        setCotando(false);
        if (res && res.opcoes && res.opcoes.length) {
          setOpcoes(res.opcoes);
          setOpcaoSel(res.opcoes[0].id);
        } else {
          setOpcoes(null);
          setOpcaoSel(null);
          /* So e "erro" quando o produto tem medidas (ou seja, o endpoint
             deveria ter respondido). Sem medidas o valor e a combinar. */
          setCotacaoErro(temMedidasFrete(itemUnico));
        }
      }, [itemUnico]);

      React.useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape") onClose(); };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [onClose]);

      /* Ao abrir o modal, se ja tiver CEP com 8 digitos, cotar pelo endpoint
         imediatamente para evitar exibir primeiro o valor da tabela. */
      React.useEffect(() => {
        const digits = cep.replace(/\D/g, "");
        if (digits.length === 8) {
          if (cepTimer.current) clearTimeout(cepTimer.current);
          cotar(digits);
        }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [produto && produto.id]);

      const onCep = (v) => {
        const fmt = formatCep(v);
        setCep(fmt);
        setOpcoes(null);
        setOpcaoSel(null);
        setCotacaoErro(false);
        if (cepTimer.current) clearTimeout(cepTimer.current);
        const digits = fmt.replace(/\D/g, "");
        if (digits.length === 8) cepTimer.current = setTimeout(() => cotar(digits), 450);
      };

      /* freteGratis do painel tem prioridade sobre a cotacao. */
      const gratis = !!(estatico && estatico.gratis);
      const endpoint = (window.FRETE_CONFIG || {}).endpoint || "";
      const temMedidasItem = temMedidasFrete(itemUnico);
      /* Prioriza o endpoint: so usa a tabela como fallback depois da tentativa
         remota falhar, ou quando nao houver endpoint/medidas para cotar. */
      const podeReal = !!endpoint && !!opcoes && opcoes.length > 0 && !gratis && temMedidasItem;
      const temOpcoes = podeReal;
      const opcaoSelObj = temOpcoes
        ? (opcoes.find((o) => o.id === opcaoSel) || opcoes[0])
        : null;
      /* Valor exibido: opcao real escolhida quando disponivel; senao tabela como
         fallback. Enquanto cotando e sem opcoes, nao exibe valor numerico da tabela. */
      let freteValor = null;
      if (podeReal) {
        freteValor = opcaoSelObj.preco;
      } else if (gratis) {
        freteValor = 0;
      } else if (cotando) {
        freteValor = null;
      } else if (estatico && !estatico.aCombinar) {
        /* fallback: usa tabela apenas se nao houver tentativa remota em andamento */
        freteValor = estatico.gratis ? 0 : estatico.valor;
      } else {
        freteValor = null;
      }
      const total = (preco && freteValor != null) ? preco + freteValor : null;
      const cepIncompleto = cep.replace(/\D/g, "").length === 8 && !estatico && !temOpcoes && !cotando;
      const esgotado = !!produto.esgotado;
      const overlayProps = useOverlayClose(onClose);

      return h("div", Object.assign({ className: "modal-overlay" }, overlayProps),
        h("div", { className: "modal modal--produto", onClick: (e) => e.stopPropagation() },
          h("button", { type: "button", className: "modal__close", onClick: onClose, "aria-label": "Fechar" }, "×"),
          h("div", { className: "produto" },
            h("div", { className: "produto__media" },
              (esgotado || produto.novo) && h("span",
                { className: "card__badge" + (esgotado ? " card__badge--esgotado" : "") },
                esgotado ? "Esgotado" : "Novo"),
              h("img", { src: produto.imagem, alt: produto.nome })
            ),
            h("div", { className: "produto__info" },
              produto.categoria && h("span", { className: "produto__cat" }, produto.categoria),
              h("h2", { className: "produto__title" }, produto.nome),
              h("p", { className: "produto__price" }, preco ? formatBRL(preco) : "Sob consulta"),
              h("p", { className: "produto__desc" }, produto.descricao ||
                "Peça impressa em 3D sob demanda. Fale com a gente para detalhes de cor, tamanho e acabamento."),
              h("ul", { className: "produto__meta" },
                produto.filamento && h("li", null, h("strong", null, "Filamento: "), produto.filamento),
                produto.peso && h("li", null, h("strong", null, "Peso: "), produto.peso + " g"),
                produto.dimensoes && h("li", null, h("strong", null, "Dimensões: "), produto.dimensoes)
              ),
              h("div", { className: "frete" },
                h("label", { className: "field" },
                  h("span", null, "Calcular frete (CEP)"),
                  h("input", { value: cep, placeholder: "00000-000", inputMode: "numeric",
                    onChange: (e) => onCep(e.target.value) })
                ),
                cotando && h("p", { className: "frete-opcoes__status" }, "Calculando opções de frete..."),
                temOpcoes && h("div", { className: "frete-opcoes" },
                  h("p", { className: "frete-opcoes__titulo" }, "Escolha o frete:"),
                  opcoes.map((o) => h("label", {
                    key: o.id,
                    className: "frete-opcao" + (opcaoSelObj && opcaoSelObj.id === o.id ? " frete-opcao--sel" : "")
                  },
                    h("input", {
                      type: "radio", name: "frete-modal", checked: !!(opcaoSelObj && opcaoSelObj.id === o.id),
                      onChange: () => setOpcaoSel(o.id)
                    }),
                    h("span", { className: "frete-opcao__nome" },
                      [o.empresa, o.servico].filter(Boolean).join(" · ") || "Frete",
                      o.estimado ? h("em", { className: "frete-opcao__nota" }, " (estimado pela tabela)") : null),
                    h("span", { className: "frete-opcao__preco" },
                      formatBRL(o.preco) + (o.prazo != null ? " · " + o.prazo + " dias" : ""))
                  ))
                ),
                gratis && h("p", { className: "frete-opcoes__status frete-opcoes__status--ok" },
                  "Frete grátis para este pedido."),
                temOpcoes && h("p", { className: "frete__res" }, "Frete para ",
                  h("strong", null, cep), ": ",
                  h("strong", null, formatBRL(opcaoSelObj.preco)),
                  opcaoSelObj.prazo != null ? h("span", null, " (" + opcaoSelObj.prazo + " dias)") : null),
                !temOpcoes && !gratis && estatico && estatico.aCombinar &&
                  h("p", { className: "frete__res" }, "Frete a combinar (fale com a gente)."),
                !temOpcoes && !gratis && estatico && !estatico.aCombinar &&
                  h("p", { className: "frete__res" }, "Frete para ",
                    h("strong", null, estatico.regiao ? estatico.regiao + " (" + cep + ")" : cep), ": ",
                    h("strong", null, formatBRL(estatico.valor)),
                    h("span", { className: "frete__res--nota" }, " (estimado pela tabela)")),
                cotacaoErro && h("p", { className: "frete-opcoes__status" },
                  "Não foi possível cotar agora; usando valor estimado."),
                cepIncompleto && h("p", { className: "frete__res frete__res--erro" }, "CEP inválido."),
                total && h("p", { className: "frete__total" }, "Total com frete: ",
                  h("strong", null, formatBRL(total)))
              ),
              h("button", { className: "btn btn--primary btn--block", disabled: esgotado,
                onClick: () => { if (!esgotado) onAdd(produto); } },
                esgotado ? "Produto esgotado" : "Adicionar ao carrinho")
            )
          )
        )
      );
    }

    /* ---------- Catalogo geral ---------- */
    function Catalog({ produtos, onAdd, cart, showAll, onToggleAll, filtro, onOpen, categorias, onFiltro }) {
      const VISIVEL = 6;
      const lista = (showAll || filtro) ? produtos : produtos.slice(0, VISIVEL);
      return h("section", { id: "catalogo", className: "section" },
        h("div", { className: "section__head" },
          h("div", null,
            h("h2", { className: "section__title" }, "Catálogo de Impressões"),
            h("p", { className: "section__sub" }, "Peças sob demanda — escolha e monte seu orçamento.")
          ),
          (!filtro && produtos.length > VISIVEL) && h("button",
            { className: "btn btn--ghost btn--sm", onClick: onToggleAll },
            showAll ? "Ver menos" : "Ver todos")
        ),
        categorias.length > 0 && h("div", { className: "filtro__cats" },

            onClick: () => onFiltro("") }, "Todas"),
          categorias.map((c) => h("button", { key: c,
            className: "menu__cat" + (filtro === c ? " menu__cat--ativo" : ""),
            onClick: () => onFiltro(c) }, c))

    /* ---------- Lancamentos (carrossel) ---------- */
    function Lancamentos({ produtos, onAdd, cart, onOpen }) {
      const ref = React.useRef(null);
      const rolar = (dir) => {
        const el = ref.current;
        if (!el) return;
        const passo = Math.max(280, el.clientWidth * 0.8);
        el.scrollBy({ left: dir * passo, behavior: "smooth" });
      };
      return h("section", { id: "lancamentos", className: "section section--alt" },
        h("div", { className: "section__head" },
          h("div", null,
            h("h2", { className: "section__title" }, "Lançamentos"),
            h("p", { className: "section__sub" }, "As novidades mais recentes do nosso ateliê.")
          ),
          h("div", { className: "carousel__nav" },
            h("button", { className: "carousel__btn", onClick: () => rolar(-1), "aria-label": "Anterior" }, "‹"),
            h("button", { className: "carousel__btn", onClick: () => rolar(1), "aria-label": "Próximo" }, "›")
          )
        ),
        h("div", { className: "carousel", ref: ref },
          produtos.map((p) => h("div", { className: "carousel__item", key: p.id },
            h(ProductCard, { produto: p, onAdd: onAdd, onOpen: onOpen, qtd: cart[p.id] ? cart[p.id].qtd : 0 })
          ))
        )
      );

    /* ---------- Formulario de orcamento ---------- */
    function QuoteForm({ items, onBack, cepInicial }) {
      const [nome, setNome] = React.useState("");
      const [cep, setCep] = React.useState(() => formatCep(cepInicial || ""));
      const [endereco, setEndereco] = React.useState("");
      const [whatsapp, setWhatsapp] = React.useState("");
      const [contato, setContato] = React.useState("");
      const [obs, setObs] = React.useState("");
      const [erro, setErro] = React.useState("");
      const [copiado, setCopiado] = React.useState(false);
      const [cepStatus, setCepStatus] = React.useState("idle");
      const [cepMsg, setCepMsg] = React.useState("");
      const [cepValidado, setCepValidado] = React.useState(false);
      const [opcoes, setOpcoes] = React.useState(null);
      const [opcaoSel, setOpcaoSel] = React.useState(null);
      const [cotando, setCotando] = React.useState(false);
      const [cotacaoErro, setCotacaoErro] = React.useState(false);
      const cepTimer = React.useRef(null);

      const semPreco = items.some((i) => !precoDe(i));
      const subtotal = items.reduce((s, i) => s + (precoDe(i) ? precoDe(i) * i.qtd : 0), 0);
      const estatico = calcularFrete(cep, items, subtotal);
      const gratis = !!(estatico && estatico.gratis);
      const temSemMedidas = !!(estatico && estatico.aCombinar);
      const endpoint = (window.FRETE_CONFIG || {}).endpoint || "";
      const podeReal = !!endpoint && !!opcoes && opcoes.length > 0 && !gratis && !temSemMedidas && !semPreco;
      const opcaoSelObj = podeReal ? (opcoes.find((o) => o.id === opcaoSel) || opcoes[0]) : null;
      const frete = podeReal
        ? { valor: opcaoSelObj.preco, prazo: opcaoSelObj.prazo, transportadora: opcaoSelObj.empresa,
            servico: opcaoSelObj.servico, real: true, estimado: !!opcaoSelObj.estimado, regiao: estatico.regiao }
        : estatico;
      const freteValor = frete && !frete.aCombinar ? (frete.gratis ? 0 : frete.valor) : null;
      const total = subtotal + (freteValor || 0);

      const totalResumo = semPreco ? "a combinar"
        : (freteValor == null ? "a combinar" : formatBRL(total));

      const cotarRemoto = async (cepDigits) => {
        if (!endpoint) return;
        setCotando(true);
        setCotacaoErro(false);
        const res = await cotarFreteRemoto(cepDigits, items);
        setCotando(false);
        if (res && res.opcoes && res.opcoes.length) {
          setOpcoes(res.opcoes);
          setOpcaoSel(res.opcoes[0].id);
        } else {
          setOpcoes(null);
          setOpcaoSel(null);
          /* Erro real so quando todos os itens tem medidas (o endpoint
             deveria ter respondido). */
          setCotacaoErro(items.every((i) => temMedidasFrete(i)));
        }
      };

      const buscarCep = async (valor) => {
        const digits = valor.replace(/\D/g, "");
        if (digits.length !== 8) {
          setCepStatus("error");
          setCepMsg("CEP inválido: informe os 8 dígitos.");
          setCepValidado(false);
          return;
        }
        setCepStatus("loading");
        setCepMsg("Buscando CEP...");
        setCepValidado(false);
        try {
          const resp = await fetch("https://viacep.com.br/ws/" + digits + "/json/");
          if (!resp.ok) throw new Error("http");
          const data = await resp.json();
          if (data.erro) {
            setCepStatus("error");
            setCepMsg("CEP não encontrado. Confira e tente novamente.");
            setCepValidado(false);
            return;
          }
          const linha = [data.logradouro, data.bairro,
            data.localidade ? data.localidade + (data.uf ? "/" + data.uf : "") : data.uf]
            .filter(Boolean).join(", ");
          setEndereco(linha);
          setCepStatus("ok");
          setCepMsg("CEP válido: " + (data.localidade ? data.localidade + "/" + data.uf : data.uf));
          setCepValidado(true);
          cotarRemoto(digits);
        } catch (err) {
          setCepStatus("fail");
          setCepMsg("Não foi possível validar o CEP agora. Verifique sua conexão.");
          setCepValidado(false);
        }
      };

      const onChangeCep = (v) => {
        const fmt = formatCep(v);
        setCep(fmt);
        setCepValidado(false);
        setCepStatus("idle");
        setCepMsg("");
        setOpcoes(null);
        setOpcaoSel(null);
        setCotacaoErro(false);
        if (cepTimer.current) clearTimeout(cepTimer.current);
        if (fmt.replace(/\D/g, "").length === 8) {
          cepTimer.current = setTimeout(() => buscarCep(fmt), 450);
        }
      };

      const onBlurCep = () => {
        const digits = cep.replace(/\D/g, "");
        if (digits.length === 8 && !cepValidado) buscarCep(cep);
      };

      React.useEffect(() => {
        const digits = (cepInicial || "").replace(/\D/g, "");
        if (digits.length === 8) buscarCep(formatCep(digits));
      }, []);

      const buildMessage = () => {
        const linhas = [
          "Olá SpaceTek! Gostaria de um orçamento.",
          "Nome: " + nome.trim(),
          "CEP: " + cep.trim(),
          "Endereço: " + endereco.trim(),
          "WhatsApp: " + (mascaraWhatsapp(whatsapp) || "")
        ];
        if (contato.trim()) linhas.push("Contato: " + contato.trim());
        linhas.push("", "Itens:");
        items.forEach((i) => {
          const p = precoDe(i);
          linhas.push("- " + i.nome + " (x" + i.qtd + ")" + (p ? " — " + formatBRL(p * i.qtd) : " — Sob consulta"));
        });
        linhas.push("", "Subtotal: " + (semPreco ? "a combinar" : formatBRL(subtotal)));
        linhas.push("Frete: " + (frete ? freteTexto(frete) : "a calcular"));
        linhas.push("Total: " + totalResumo);
        if (obs.trim()) linhas.push("", "Observações: " + obs.trim());
        return linhas.join("\n");
      };

      const validar = () => {
        if (!nome.trim()) return "Informe seu nome.";
        const digits = cep.replace(/\D/g, "");
        if (digits.length !== 8) return "Informe um CEP válido (8 dígitos).";
        if (!cepValidado) return "Confirme um CEP válido antes de enviar.";
        if (!endereco.trim()) return "Informe o número e o complemento do endereço.";
        if (!numeroWhatsappValido(whatsapp)) return "Informe um WhatsApp válido com DDD (10 ou 11 dígitos).";
        return "";
      };

      const enviar = async (e) => {
        e.preventDefault();
        const msgErro = validar();
        if (msgErro) { setErro(msgErro); return; }
        setErro("");
        try {
          const worker = window.WORKER_URL || "https://spacetek-frete.spacetek.workers.dev";
          const pedido = {
            nome: nome.trim(),
            whatsapp: numeroWhatsappCompleto(whatsapp),
            contato: contato.trim(),
            cep: cep.trim(),
            endereco: endereco.trim(),
            obs: obs.trim(),
            itens: items.map((i) => ({ id: i.id, nome: i.nome, qtd: i.qtd, preco: precoDe(i), imagem: i.imagem })),
            subtotal: subtotal,
            frete: frete ? { valor: frete.valor, gratis: frete.gratis, prazo: frete.prazo, transportadora: frete.transportadora, servico: frete.servico, real: frete.real, estimado: frete.estimado } : null,
            total: total
          };
          const resp = await fetch(worker + "/order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pedido) });
          let data = null;
          try { data = await resp.json(); } catch (e2) {}
          let msg = buildMessage();
          if (data && data.id) msg = "Pedido: " + data.id + "\n\n" + msg;
          const url = "https://wa.me/" + window.WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
          window.open(url, "_blank");
        } catch (err) {
          const url = "https://wa.me/" + window.WHATSAPP_NUMBER + "?text=" + encodeURIComponent(buildMessage());
          window.open(url, "_blank");
        }
      };

      const copiar = async () => {
        try {
          await navigator.clipboard.writeText(buildMessage());
          setCopiado(true);
          setTimeout(() => setCopiado(false), 2000);
        } catch (err) {
          setErro("Não foi possível copiar automaticamente.");
        }
      };

      const campo = (rotulo, valor, setValor, placeholder, extra) =>
        h("label", { className: "field" },
          h("span", null, rotulo),
          h("input", { value: valor, placeholder: placeholder, onChange: (e) => setValor(e.target.value), ...extra })
        );

      return h("form", { className: "quote", onSubmit: enviar },
        h("button", { type: "button", className: "quote__back", onClick: onBack }, "← Voltar à sacola"),
        h("h3", { className: "quote__title" }, "Solicitar orçamento"),
        campo("Nome *", nome, setNome, "Seu nome"),
        h("label", { className: "field" },
          h("span", null, "CEP *"),
          h("input", { value: cep, placeholder: "00000-000", inputMode: "numeric",
            onChange: (e) => onChangeCep(e.target.value), onBlur: onBlurCep }),
          cepMsg && h("small", { className: "field__hint field__hint--" + cepStatus }, cepMsg)
        ),
        cotando && h("p", { className: "frete-opcoes__status" }, "Calculando opções de frete..."),
        gratis && h("p", { className: "frete-opcoes__status frete-opcoes__status--ok" }, "Frete grátis para este pedido."),
        podeReal && h("div", { className: "frete-opcoes" },
          h("p", { className: "frete-opcoes__titulo" }, "Escolha o frete:"),
          opcoes.map((o) => h("label", { key: o.id, className: "frete-opcao" + (opcaoSelObj && opcaoSelObj.id === o.id ? " frete-opcao--sel" : "") },
            h("input", { type: "radio", name: "frete", checked: !!(opcaoSelObj && opcaoSelObj.id === o.id),
              onChange: () => setOpcaoSel(o.id) }),
            h("span", { className: "frete-opcao__nome" },
              [o.empresa, o.servico].filter(Boolean).join(" · ") || "Frete",
              o.estimado ? h("em", { className: "frete-opcao__nota" }, " (estimado pela tabela)") : null),
            h("span", { className: "frete-opcao__preco" }, formatBRL(o.preco) + (o.prazo != null ? " · " + o.prazo + " dias" : ""))
          ))
        ),        cotacaoErro && h("p", { className: "frete-opcoes__status" }, "Não foi possível cotar agora; usando valor estimado."),
        campo("Endereço *", endereco, setEndereco, "Número e complemento (rua/cidade preenchidos pelo CEP)"),
        h("label", { className: "field" },
          h("span", null, "WhatsApp *"),
          h("input", { value: mascaraWhatsapp(whatsapp), placeholder: "(00) 00000-0000", inputMode: "numeric",
            onChange: (e) => setWhatsapp(digitosWhatsapp(e.target.value)) }),
          h("small", { className: "field__hint field__hint--idle" },
            "Obrigatório: usamos este número para avisar você quando o pedido mudar de status.")
        ),
        campo("E-mail ou outro contato (opcional)", contato, setContato, "email@exemplo.com"),
        h("label", { className: "field" },
          h("span", null, "Observações (opcional)"),
          h("textarea", { value: obs, rows: 2, placeholder: "Cor do filamento, tamanho...",
            onChange: (e) => setObs(e.target.value) })
        ),
        erro && h("p", { className: "quote__erro" }, erro),
        h("div", { className: "quote__actions" },
          h("button", { type: "submit", className: "btn btn--primary btn--block" }, "Confirmar pedido"),
          h("button", { type: "button", className: "btn btn--ghost btn--block", onClick: copiar },
            copiado ? "Copiado!" : "Copiar pedido")
        )
      );
    }

    /* ---------- Sacola (drawer) ---------- */
    function CartDrawer({ open, onClose, items, onInc, onDec, onRemove }) {
      const [showQuote, setShowQuote] = React.useState(false);
      const [cep, setCep] = React.useState(() => {
        try { return localStorage.getItem("spacetek_cep") || ""; } catch (e) { return ""; }
      });
      const [opcoes, setOpcoes] = React.useState(null);
      const [opcaoSel, setOpcaoSel] = React.useState(null);
      const [cotando, setCotando] = React.useState(false);
      const [cotacaoErro, setCotacaoErro] = React.useState(false);
      const cepTimer = React.useRef(null);

      React.useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape") onClose(); };
        if (open) document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [open, onClose]);

      React.useEffect(() => { if (!open) setShowQuote(false); }, [open]);

      React.useEffect(() => {
        try { localStorage.setItem("spacetek_cep", cep); } catch (e) { /* ignora */ }
      }, [cep]);

      const endpoint = (window.FRETE_CONFIG || {}).endpoint || "";

      const cotarRemoto = React.useCallback(async (cepDigits) => {
        if (!endpoint || items.length === 0) return;
        /* se algum item nao tem medidas, endpoint nao deve ser usado como padrao */
        if (items.some((i) => !temMedidasFrete(i))) {
          setOpcoes(null);
          setOpcaoSel(null);
          setCotacaoErro(true);
          return;
        }
        const hasSemPreco = items.some((i) => !precoDe(i));
        if (hasSemPreco) {
          setOpcoes(null);
          setOpcaoSel(null);
          return;
        }
        setCotando(true);
        setCotacaoErro(false);
        const res = await cotarFreteRemoto(cepDigits, items);
        setCotando(false);
        if (res && res.opcoes && res.opcoes.length) {
          setOpcoes(res.opcoes);
          setOpcaoSel(res.opcoes[0].id);
        } else {
          setOpcoes(null);
          setOpcaoSel(null);
          /* erro real so quando todos tem medidas */
          setCotacaoErro(items.every((i) => temMedidasFrete(i)));
        }
      }, [endpoint, items]);

      /* Cotacao pelo endpoint ao abrir a sacola e sempre que os itens ou o
         endpoint mudarem (o FRETE_CONFIG pode carregar depois da abertura). */
      React.useEffect(() => {
        if (!open) return;
        const digits = cep.replace(/\D/g, "");
        if (digits.length === 8) {
          if (cepTimer.current) clearTimeout(cepTimer.current);
          cotarRemoto(digits);
        }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [open, endpoint, items]);

      const onCep = (v) => {
        const fmt = formatCep(v);
        setCep(fmt);
        setOpcoes(null);
        setOpcaoSel(null);
        setCotacaoErro(false);
        if (cepTimer.current) clearTimeout(cepTimer.current);
        const digits = fmt.replace(/\D/g, "");
        if (digits.length === 8) {
          cepTimer.current = setTimeout(() => cotarRemoto(digits), 450);
        }
      };

      const totalItens = items.reduce((s, i) => s + i.qtd, 0);
      const semPreco = items.some((i) => !precoDe(i));
      const subtotal = items.reduce((s, i) => s + (precoDe(i) ? precoDe(i) * i.qtd : 0), 0);
      const estatico = calcularFrete(cep, items, subtotal);
      const gratis = !!(estatico && estatico.gratis);
      const temSemMedidas = !!(estatico && estatico.aCombinar);
      /* Prioriza o endpoint: a tabela so entra como reserva depois que a
         cotacao remota falhar (ou quando nao houver endpoint/medidas). */
      const podeReal = !!endpoint && !!opcoes && opcoes.length > 0 && !gratis && !temSemMedidas && !semPreco;
      const opcaoSelObj = podeReal ? (opcoes.find((o) => o.id === opcaoSel) || opcoes[0]) : null;
      /* Valor exibido: opcao real quando disponivel; senao tabela como reserva.
         Enquanto cotando e sem opcoes, nao exibe valor (evita o flash da tabela). */
      let frete = null;
      let tabelaReserva = false;
      if (podeReal) {
        frete = { valor: opcaoSelObj.preco, prazo: opcaoSelObj.prazo, transportadora: opcaoSelObj.empresa,
          servico: opcaoSelObj.servico, real: true, estimado: !!opcaoSelObj.estimado, regiao: estatico && estatico.regiao };
      } else if (gratis) {
        frete = estatico;
      } else if (cotando) {
        frete = null;
      } else if (estatico && !estatico.aCombinar) {
        frete = estatico;
        /* reserva da tabela com endpoint configurado: rotula como estimado */
        tabelaReserva = !!endpoint;
      } else if (estatico && estatico.aCombinar) {
        frete = estatico;
      }
      const freteValor = frete && !frete.aCombinar ? (frete.gratis ? 0 : frete.valor) : null;
      const total = subtotal + (freteValor || 0);

    /* ---------- App ---------- */
    function App() {
      const [cart, setCart] = React.useState(() => {
        try { return JSON.parse(localStorage.getItem("spacetek_cart")) || {}; }
        catch (e) { return {}; }
      });
      const [cartOpen, setCartOpen] = React.useState(false);
      const [showAll, setShowAll] = React.useState(false);
      const [menuOpen, setMenuOpen] = React.useState(false);
      const [filtro, setFiltro] = React.useState("");
      const [produtosFs, setProdutosFs] = React.useState(null);
      const [selected, setSelected] = React.useState(null);
      const [cfg, setCfg] = React.useState(null);

      React.useEffect(() => {
        try { localStorage.setItem("spacetek_cart", JSON.stringify(cart)); }
        catch (e) { /* armazenamento indisponivel (ex.: file://) — ignora */ }
      }, [cart]);

      React.useEffect(() => {
        if (!window.fbDb) return;
        let unsub = null;
        try {
          unsub = window.fbDb.collection("produtos").orderBy("ordem", "asc").onSnapshot(
            (snap) => setProdutosFs(snap.docs.map((d) => Object.assign({ id: d.id }, d.data()))),
            (err) => { console.warn("Firestore:", err.message); setProdutosFs(null); }
          );
        } catch (e) { setProdutosFs(null); }
        return () => { if (unsub) unsub(); };
      }, []);

      React.useEffect(() => {
        if (!window.fbDb) return;
        let unsub = null;
        const aplicarLegado = () => {
          window.fbDb.doc("config/geral").get()
            .then((s) => { const d = s.exists ? s.data() : {}; setCfg(d.hero ? d : {}); })
            .catch(() => setCfg({}));
        };
        try {
          unsub = window.fbDb.collection("produtos").doc("_site").onSnapshot(
            (snap) => {
              const d = snap.exists ? snap.data() : {};
              if (d.hero || d.frete) setCfg(d);
              else aplicarLegado();
            },
            (err) => {
              console.warn("Firestore config:", err.code || err.message);
              aplicarLegado();
            }
          );
        } catch (e) { setCfg({}); }
        return () => { if (unsub) unsub(); };
      }, []);
      /* Publica a config de frete para o calculo (tabela, peso, frete gratis). */
      React.useEffect(() => {
        window.FRETE_CONFIG = (cfg && cfg.frete) ? cfg.frete : null;
      }, [cfg]);
      /* Sincroniza o carrinho com o banco: descarta itens esgotados, removidos
         do catalogo ou que tiveram seus dados alterados (evita erro/valor velho). */
      React.useEffect(() => {
        if (!produtosFs || produtosFs.length === 0) return;
        setCart((prev) => {
          const mapa = {};
          produtosFs.forEach((p) => { mapa[p.id] = p; });
          let mudou = false;
          const novo = {};
          Object.keys(prev).forEach((id) => {
            const item = prev[id];
            const prod = mapa[id];
            if (!prod || prod.esgotado || assinaturaProduto(prod) !== assinaturaProduto(item)) {
              mudou = true;
              return;
            }
            novo[id] = item;
          });
          return mudou ? novo : prev;
        });
      }, [produtosFs]);

      /* Trava a rolagem do fundo enquanto um drawer/modal estiver aberto. */
      React.useEffect(() => {
        const aberto = cartOpen || menuOpen || !!selected;
        document.body.classList.toggle("no-scroll", aberto);
        return () => document.body.classList.remove("no-scroll");
      }, [cartOpen, menuOpen, selected]);

      /* Contadores do dia (painel admin): 1 visita por sessao. */
      React.useEffect(() => {
        try {
          if (sessionStorage.getItem("spacetek_visita")) return;
          sessionStorage.setItem("spacetek_visita", "1");
        } catch (e) { /* ignora */ }
        registrarEvento("visita");
      }, []);

      /* Abrir o detalhe de um produto (contador "cliques em produto"). */
      const abrirProduto = (p) => {
        registrarEvento("produto");
        setSelected(p);
      };

      /* Abrir a sacola (contador "acessos ao carrinho"). */
      const abrirCarrinho = () => {
        registrarEvento("carrinho");
        setCartOpen(true);
      };

      const addItem = (produto) => {
        if (produto.esgotado) return;
        setCart((prev) => {
          const atual = prev[produto.id] || Object.assign({}, produto, { qtd: 0 });
          const novo = Object.assign({}, prev);
          novo[produto.id] = Object.assign({}, atual, { qtd: atual.qtd + 1 });
          return novo;
        });
      };
      const inc = (id) => setCart((p) => Object.assign({}, p, {
        [id]: Object.assign({}, p[id], { qtd: p[id].qtd + 1 })
      }));
      const dec = (id) => setCart((p) => {
        const novo = Object.assign({}, p);
        const q = p[id].qtd - 1;
        if (q <= 0) delete novo[id];
        else novo[id] = Object.assign({}, p[id], { qtd: q });
        return novo;
      });
      const remove = (id) => setCart((p) => { const n = Object.assign({}, p); delete n[id]; return n; });

      const items = Object.values(cart);
      const totalItens = items.reduce((s, i) => s + i.qtd, 0);

      const todosBase = (produtosFs && produtosFs.length > 0)
        ? produtosFs
        : (window.CATALOGO || []).map((p) => Object.assign({}, p, { secao: "catalogo" }))
            .concat((window.LANCAMENTOS || []).map((p) => Object.assign({}, p, { secao: "lancamentos" })));
      const todos = todosBase.slice().sort(cmpProd);
      const catalogo = todos.filter((p) => (p.secao || "catalogo") !== "lancamentos");
      const lancamentos = todos.filter((p) => p.secao === "lancamentos");
      const categorias = [];
      todos.forEach((p) => { if (p.categoria && categorias.indexOf(p.categoria) < 0) categorias.push(p.categoria); });
      const fonteHero = (cfg && cfg.hero === "destaques") ? "destaques" : "lancamentos";
      const marcados = todos.filter((p) => p.destaque);
      const destaques = (fonteHero === "destaques" && marcados.length > 0)
        ? marcados.slice(0, 3)
        : (lancamentos.length > 0 ? lancamentos : catalogo).slice(0, 3);

      const catalogoFiltrado = filtro ? todos.filter((p) => p.categoria === filtro) : catalogo;

      const limparFiltro = () => setFiltro("");
      const onFiltro = (cat) => { setFiltro(cat); setShowAll(true); };
      const irCategoria = (cat) => {
        setFiltro(cat);
        setShowAll(true);
        setMenuOpen(false);
        setTimeout(() => irPara("catalogo"), 60);
      };

      return h(React.Fragment, null,
        h(Header, {
          cartCount: totalItens,
          onOpenCart: abrirCarrinho,
          onInicio: () => { limparFiltro(); irPara("inicio"); },
          onVerTodos: () => { limparFiltro(); setShowAll(true); irPara("catalogo"); },
          onQuemSomos: () => irPara("sobre"),
          onToggleMenu: () => setMenuOpen(true),
          onLogoAdmin: () => {
            /* Duplo clique na logo abre o painel em uma aba nova (/admin/). */
            try {
              const w = window.open("admin/", "_blank", "noopener");
              if (w) w.focus();
            } catch (e) { window.location.href = "admin/"; }
          }
        }),
        h("main", null,
          h(Hero, { destaques: destaques }),
          h(Catalog, { produtos: catalogoFiltrado, onAdd: addItem, cart: cart,
            showAll: showAll, onToggleAll: () => setShowAll((v) => !v),
            filtro: filtro, onOpen: abrirProduto, categorias: categorias, onFiltro: onFiltro }),
          lancamentos.length > 0 && !filtro && h(Lancamentos, { produtos: lancamentos, onAdd: addItem, cart: cart,
            onOpen: abrirProduto }),
          h(Personalizado, null),
          h(About, null)
        ),
        h(Footer, { onNav: irPara }),
        h(WhatsAppFloat, null),
        h(MenuDrawer, {
          open: menuOpen,
          onClose: () => setMenuOpen(false),
          onInicio: () => { setMenuOpen(false); limparFiltro(); irPara("inicio"); },
          onVerTodos: () => { setMenuOpen(false); limparFiltro(); setShowAll(true); irPara("catalogo"); },
          onQuemSomos: () => { setMenuOpen(false); irPara("sobre"); },
          onPersonalizado: () => { setMenuOpen(false); irPara("personalizado"); },
          categorias: categorias,
          onCategoria: irCategoria
        }),
        h(CartDrawer, { open: cartOpen, onClose: () => setCartOpen(false), items: items,
          onInc: inc, onDec: dec, onRemove: remove }),
        selected && h(ProdutoModal, { produto: selected, onClose: () => setSelected(null),
          onAdd: (p) => { addItem(p); setSelected(null); abrirCarrinho(); } })
      );
    }

    /* ---------- Protecao contra erros de render (evita tela branca) ---------- */
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { erro: null }; }
      static getDerivedStateFromError(err) { return { erro: err }; }
      componentDidCatch(err, info) {
        try { console.error("Erro na aplicacao:", err, info); } catch (e) {}
      }
      render() {
        if (this.state.erro) {
          return h("div", { className: "erro-app" },
            h("div", { className: "erro-app__card" },
              h("h1", { className: "erro-app__title" }, "Algo deu errado"),
              h("p", { className: "erro-app__text" },
                "Ocorreu um erro inesperado. Tente recarregar a página."),
              h("button", { type: "button", className: "btn btn--primary",
                onClick: () => location.reload() }, "Recarregar")
            )
          );
        }
        return this.props.children;
      }
    }

    const raiz = ReactDOM.createRoot(document.getElementById("root"));
    function iniciar() {
      raiz.render(h(ErrorBoundary, null,
        window.MANUTENCAO ? h(Manutencao, null) : h(App, null)));
    }

    /* Carrega a flag de manutencao sem cache (para valer de imediato).
       Em http(s): se a leitura falhar, mostra a manutencao (fail-closed),
       para nao revelar o site. Em file://: usa a flag ja carregada. */
    if (location.protocol === "file:") {
      iniciar();
    } else {
      const s = document.createElement("script");
      s.src = "data/maintenance.js?t=" + Date.now();
      s.onload = iniciar;
      s.onerror = () => raiz.render(h(ErrorBoundary, null, h(Manutencao, null)));
      document.head.appendChild(s);
    }
  </script>

  <script>
    window.WORKER_URL = window.WORKER_URL || "https://spacetek-frete.spacetek.workers.dev";
  </script>

  <!-- Auto-atualizacao: se a versao publicada mudar, recarrega sem cache. -->
  <script>
    (function () {
      if (location.protocol === "file:") return;
      try {
        var req = new XMLHttpRequest();
        req.open("GET", "version.json?t=" + Date.now(), true);
        req.onload = function () {
          try {
            var dados = JSON.parse(req.responseText);
            var nova = dados && dados.v;
            if (!nova) return;
            if (nova !== window.__APP_VERSION) {
              var chave = "spacetek_ver";
              if (sessionStorage.getItem(chave) !== nova) {
                sessionStorage.setItem(chave, nova);
                location.replace(location.pathname + "?v=" + encodeURIComponent(nova) + location.hash);
              }
            } else if (location.search.indexOf("v=") >= 0) {
              history.replaceState(null, "", location.pathname + location.hash);
            }
          } catch (e) {}
        };
        req.send();
      } catch (e) {}
    })();
  </script>
</body>
