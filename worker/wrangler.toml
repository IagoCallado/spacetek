name = "spacetek-frete"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Variaveis nao-secretas. Segredos (PROVEDOR_TOKEN, CEP_ORIGEM) via:
#   wrangler secret put PROVEDOR_TOKEN
#   wrangler secret put CEP_ORIGEM
[vars]
PROVEDOR = "frenet"
USER_AGENT = "SpaceTek Frete (contato@spacetek.com)"
# Origens permitidas (separadas por virgula). Ajuste conforme o dominio.
ALLOWED_ORIGINS = "https://iagocallado.github.io,http://localhost:8899,http://localhost:8900"
